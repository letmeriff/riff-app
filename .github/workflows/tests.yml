name: Riff Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  # Allow manual execution of tests
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run frontend unit tests with coverage
        working-directory: frontend
        run: npm run test:ci
      
      - name: Run backend unit tests with coverage
        working-directory: backend
        run: npm run test:ci

      - name: Upload frontend test coverage
        uses: actions/upload-artifact@v3
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 14

      - name: Upload backend test coverage
        uses: actions/upload-artifact@v3
        with:
          name: backend-coverage
          path: backend/coverage
          retention-days: 14

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: riff_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Setup test database
        working-directory: backend
        run: npm run test:setup-db

      - name: Run integration tests
        working-directory: backend
        run: npm run test:integration

  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Setup frontend environment
        working-directory: frontend
        run: |
          npm ci
          echo "REACT_APP_API_URL=http://localhost:8000" > .env
          echo "REACT_APP_SUPABASE_URL=${{ secrets.REACT_APP_SUPABASE_URL }}" >> .env
          echo "REACT_APP_SUPABASE_ANON_KEY=${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}" >> .env

      - name: Setup backend environment
        working-directory: backend
        run: |
          npm ci
          echo "PORT=8000" > .env
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env

      - name: Start backend server
        working-directory: backend
        run: nohup npm run start &
        env:
          NODE_ENV: test

      - name: Start frontend server
        working-directory: frontend
        run: nohup npm run start &
        env:
          NODE_ENV: test

      - name: Wait for servers to start
        run: |
          echo "Waiting for frontend and backend to start..."
          sleep 30

      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download frontend coverage
        uses: actions/download-artifact@v3
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Download backend coverage
        uses: actions/download-artifact@v3
        with:
          name: backend-coverage
          path: backend/coverage

      - name: Generate combined coverage report
        run: |
          npm ci
          npm run generate-coverage-report

      - name: Upload combined coverage report
        uses: actions/upload-artifact@v3
        with:
          name: combined-coverage-report
          path: coverage-report/
          retention-days: 14

      - name: Check coverage thresholds
        run: |
          FRONTEND_COVERAGE=$(cat frontend/coverage/coverage-summary.json | jq '.total.lines.pct')
          BACKEND_COVERAGE=$(cat backend/coverage/coverage-summary.json | jq '.total.lines.pct')
          
          echo "Frontend coverage: $FRONTEND_COVERAGE%"
          echo "Backend coverage: $BACKEND_COVERAGE%"
          
          if (( $(echo "$FRONTEND_COVERAGE < 80" | bc -l) )); then
            echo "⚠️ Warning: Frontend coverage is below 80% threshold at $FRONTEND_COVERAGE%"
          fi
          
          if (( $(echo "$BACKEND_COVERAGE < 80" | bc -l) )); then
            echo "⚠️ Warning: Backend coverage is below 80% threshold at $BACKEND_COVERAGE%"
          fi 